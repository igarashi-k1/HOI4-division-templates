l_english:
 division_templates_category:0 "師団編成"
 division_templates_category_desc:0 "新しい師団テンプレートの追加と、その師団の配置を行います。"
 add_template_infantry_12:0 "歩兵師団テンプレートを追加"
 add_template_infantry_12_desc:0 "歩兵大隊12（4個×3列）と支援中隊（砲兵・工兵・騎兵偵察）の師団テンプレート「Infantry Division 12」を追加し、初期野戦砲・支援装備・工兵・騎兵偵察の技術を習得します。"
 add_template_cavalry_12:0 "騎兵師団テンプレートを追加"
 add_template_cavalry_12_desc:0 "騎兵大隊12（4個×3列）と支援中隊（砲兵・工兵・騎兵偵察）の師団テンプレート「Cavalry Division 12」を追加し、初期野戦砲・支援装備・工兵・騎兵偵察の技術を習得します。"
 deploy_infantry_12:0 "歩兵師団を配置"
 deploy_infantry_12_desc:0 "「Infantry Division 12」の師団を首都に24個配置します。"
 deploy_cavalry_12:0 "騎兵師団を配置"
 deploy_cavalry_12_desc:0 "「Cavalry Division 12」の師団を首都に24個配置します。"
 add_template_artillery_16:0 "砲兵師団テンプレートを追加"
 add_template_artillery_16_desc:0 "砲兵大隊8（4個×2列）・歩兵大隊8（4個×2列）と支援中隊（砲兵・工兵・騎兵偵察）の師団テンプレート「Artillery Division 16」を追加し、初期野戦砲・支援装備・工兵・騎兵偵察の技術を習得します。"
 deploy_artillery_16:0 "砲兵師団を配置"
 deploy_artillery_16_desc:0 "「Artillery Division 16」の師団を首都に24個配置します。"
 add_template_motorized_16:0 "自動車化師団テンプレートを追加"
 add_template_motorized_16_desc:0 "自動車化歩兵大隊8（4個×2列）・自動車化砲兵大隊8（4個×2列）と支援中隊（砲兵・工兵・自動車化偵察）の師団テンプレート「Motorized Division 16」を追加し、初期野戦砲・支援装備・工兵・偵察中隊・自動車化歩兵の技術を習得します。"
 deploy_motorized_16:0 "自動車化師団を配置"
 deploy_motorized_16_desc:0 "「Motorized Division 16」の師団を首都に24個配置します。"
